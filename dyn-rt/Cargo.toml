[package]
name = "dyn-rt"
version = "0.1.0"
edition = "2024"

[dependencies]
dyn-rt-utils = { path = "../dyn-rt-utils" }
dyn-rt-macros = { path = "../dyn-rt-macros" }
libloading = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
blake3 = "1.8.2"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread"] }
schemars = "1.2.0"
